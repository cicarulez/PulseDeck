name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: apps/configurator/package-lock.json
      - name: Portable tests, frontend and Windows package
        run: ./scripts/build.sh
      - name: Desktop navigation policy
        run: node --test apps/desktop/policy.test.cjs
      - name: Documentation renderer
        run: dotnet run --project tools/docs-gallery -c Release -- artifacts/docs-gallery
      - name: Check documentation links
        run: python3 scripts/check-doc-links.py
      - name: Keep the Windows package for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PulseDeck-windows-x64-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 7
